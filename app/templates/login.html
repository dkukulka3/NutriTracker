{% extends "base.html" %}

{% block content %}

<h2>Login</h2>

{% if error %}
    <p class="error">{{ error }}</p>
{% endif %}

<div class="card">
<form method="POST">

    <label for="email">Email:</label>
    <input
        type="email"
        id="email"
        name="email"
        value="{{ request.form.get('email', '') }}"
        required
    >

    <label for="password">Password:</label>
    <input
        type="password"
        id="password"
        name="password"
        required
    >

    <button type="submit">Login</button>

</form>
</div>

{% endblock %}
